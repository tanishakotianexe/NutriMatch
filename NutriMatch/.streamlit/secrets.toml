# Recipe view: paste ONE key to let an LLM write recipes for dishes that are not
# in the local recipe dataset. The same names also work as environment variables.
# Gemini (default, free tier): https://aistudio.google.com/apikey
GEMINI_API_KEY = ""

# OpenAI instead (used only when no Gemini key is set):
# OPENAI_API_KEY = ""

# Force a provider when both keys are present: "gemini" or "openai".
# LLM_PROVIDER = "gemini"

# Optional model overrides.
# GEMINI_MODEL = "gemini-2.5-flash"
# OPENAI_MODEL = "gpt-4o-mini"
